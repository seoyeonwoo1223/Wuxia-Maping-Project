<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무협용 중국전도</title>
<meta name="description" content="2003년 「무협용 중국전도 Ver. 2.0」(낙방수재)을 웹 지도로 다시 만든 것. 성별 지도, 지명·문파 설명, 제왕연표.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="brand-hanja">武林用中國全圖</span><span class="brand-ko">무협용 중국전도</span></a>
  <nav class="nav" aria-label="주 메뉴">
    <a href="#/" data-nav="map">지도</a>
    <a href="#/emperors" data-nav="emperors">제왕연표</a>
    <a href="#/landmarks" data-nav="landmarks">주요지명</a>
    <a href="#/about" data-nav="about">정보</a>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="지명·문파 검색 (예: 아미, 少林)" autocomplete="off" aria-label="지명·문파 검색" aria-controls="results">
    <ul id="results" class="results" role="listbox" hidden></ul>
  </div>
</header>

<main>
  <section id="view-map" class="view">
    <div class="map-wrap">
      <div class="crumbs" id="crumbs"></div>
      <svg id="map" class="map" role="img" aria-label="지도"></svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="확대">+</button>
        <button type="button" id="zout" aria-label="축소">−</button>
        <button type="button" id="zfit" aria-label="전체 보기">⤢</button>
      </div>
    </div>
    <aside id="panel" class="panel" aria-live="polite">
      <button type="button" class="panel-grip" id="grip" aria-label="패널 펼치기/접기"></button>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </section>
  <section id="view-page" class="view page" hidden></section>
</main>

<noscript><p class="noscript">이 사이트는 JavaScript가 필요합니다.</p></noscript>
<script src="app.js"></script>
</body>
</html>
